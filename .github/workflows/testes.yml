# Roda os testes a cada push na main e em todo pull request, no Linux e no
# Windows. O Windows é o que não dá para testar numa máquina Linux: o
# programa compilado com o linker da Microsoft, as telas com as ferramentas
# falsas em .cmd, a janela do console fechada no meio de uma reescrita (W-1)
# e o pacote como chega ao usuário.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

env:
  # A versão do Rust fica fixa: cada versão nova pode trazer avisos novos do
  # clippy e deixar o CI vermelho sem o código ter mudado. Para atualizar,
  # troque aqui e corrija o que o clippy novo apontar.
  RUST: "1.98.0"

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - name: Rust ${{ env.RUST }}
        run: |
          rustup toolchain install ${{ env.RUST }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST }}
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes de unidade
        run: cargo test
      - name: Compilar
        run: cargo build --release
      - name: Compilar a versão do teste de erro fatal (V-4)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --features teste-erro-fatal --target-dir target/erro-fatal
          "XM_PROGRAMA_ERRO_FATAL=$PWD\target\erro-fatal\release\xiso-manager.exe" >> $env:GITHUB_ENV
      # Os testes das telas e da auditoria conduzem o programa compilado
      # pelo teclado, com as ferramentas falsas (tests/falsos), escritas em
      # Python.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Telas, auditoria e pacote
        run: python -m unittest discover -s tests -v
      - name: Guardar o programa
        uses: actions/upload-artifact@v5
        with:
          name: xiso-manager-${{ runner.os }}
          path: |
            target/release/xiso-manager
            target/release/xiso-manager.exe
          if-no-files-found: error
          retention-days: 7
